[project]
name = "sktime-copyleft-libs"
version = "0.1.0"
description = "Copyleft-licensed libraries for use with sktime (GPL and similar)"
readme = "README.md"
keywords = [
  "copyleft",
  "data-science",
  "forecasting",
  "gpl",
  "machine-learning",
  "sktime",
  "time-series",
]
# this distribution is copyleft, unlike sktime itself, which is BSD-3-Clause
license = "GPL-3.0-only"
license-files = [ "LICENSE" ]
maintainers = [
  { name = "sktime developers", email = "sktime.toolbox@gmail.com" },
]
authors = [
  { name = "sktime developers", email = "sktime.toolbox@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development",
]

# hard dependencies required by the vendored libraries
# these are deliberately hard, not soft: this package exists only to carry
# vendored model code, and that code needs all of them at runtime
dependencies = [
  "huggingface-hub>=0.19",
  "numpy>=1.21",
  "pandas>=1.3",
  "safetensors>=0.4",
  "scikit-learn>=1",
  "scipy>=1.7",
  "statsmodels>=0.14.4",
  "torch>=1.10",
]

urls.Homepage = "https://github.com/sktime/sktime-copyleft-libs"
urls.Issues = "https://github.com/sktime/sktime-copyleft-libs/issues"
urls.Repository = "https://github.com/sktime/sktime-copyleft-libs"

[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=78.1.1",
]

[tool.setuptools.packages.find]
where = [ "src" ]
